<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 3 - Kevin Shema</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Kevin Shema - IYF S12 Week 03</h1>
        <p>Interactive Web Page with JavaScript</p>
    </header>

    <main>
        <section class="card">
            <h2>Welcome!</h2>
            <p id="greeting">Click the button to see JavaScript in action.</p>
            <button id="changeBtn">Click Me</button>
        </section>

        <section class="card">
            <h2>Contact Form</h2>
            <form id="contactForm">
                <input type="text" id="name" placeholder="Your Name" required>
                <input type="email" id="email" placeholder="Your Email" required>
                <textarea id="message" placeholder="Your Message"></textarea>
                <button type="submit">Send Message</button>
            </form>
            <p id="formStatus"></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 ShemaKevin970 - GitHub: ShemaKevin970</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
